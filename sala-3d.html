    <!-- COMPONENTES Y LÓGICA DE ANTICOLISIÓN -->
    <script>
        AFRAME.registerComponent('anti-colisiones', {
            init: function () {
                this.playerHalfWidth = 0.35;
                this.playerHeight = 1.6;
                this.obstacleBoxes = [];
                this.playerBox = new THREE.Box3();
                this.lastGoodPosition = null;
                this.maxStepSize = 0.05;
                this.velocity = new THREE.Vector3();
                this.cameraEl = this.el.querySelector('a-camera');

                if (this.el.sceneEl.hasLoaded) {
                    this.actualizarCajasObstaculos();
                } else {
                    this.el.sceneEl.addEventListener('loaded', () => this.actualizarCajasObstaculos());
                }
            },

            actualizarCajasObstaculos: function () {
                this.obstacleBoxes = Array.from(document.querySelectorAll('.colision')).map(el => {
                    el.object3D.updateMatrixWorld(true);
                    return new THREE.Box3().setFromObject(el.object3D);
                });
            },

            hayColision: function (posicion) {
                this.playerBox.setFromCenterAndSize(
                    posicion,
                    new THREE.Vector3(this.playerHalfWidth * 2, this.playerHeight, this.playerHalfWidth * 2)
                );
                for (let i = 0; i < this.obstacleBoxes.length; i++) {
                    if (this.playerBox.intersectsBox(this.obstacleBoxes[i])) return true;
                }
                return false;
            },

            moverEjeSeguro: function (posActual, targetX, targetZ) {
                const dx = targetX - posActual.x;
                const dz = targetZ - posActual.z;
                const distancia = Math.sqrt(dx * dx + dz * dz);

                if (distancia === 0) return posActual;

                const pasos = Math.max(1, Math.ceil(distancia / this.maxStepSize));
                const stepX = dx / pasos;
                const stepZ = dz / pasos;

                let x = posActual.x;
                let z = posActual.z;

                for (let i = 0; i < pasos; i++) {
                    const nextX = x + stepX;
                    const nextZ = z + stepZ;

                    if (!this.hayColision(new THREE.Vector3(nextX, posActual.y, z))) {
                        x = nextX;
                    }
                    if (!this.hayColision(new THREE.Vector3(x, posActual.y, nextZ))) {
                        z = nextZ;
                    }
                }

                return new THREE.Vector3(x, posActual.y, z);
            },

            tick: function (time, deltaTime) {
                const rig = this.el.object3D;
                const pos = rig.position;

                if (pos.y < 1.6) pos.y = 1.6;

                if (!this.lastGoodPosition) {
                    this.lastGoodPosition = pos.clone();
                    return;
                }

                const deltaX = pos.x - this.lastGoodPosition.x;
                const deltaZ = pos.z - this.lastGoodPosition.z;

                if (deltaX !== 0 || deltaZ !== 0) {
                    const cameraRotationY = this.cameraEl.object3D.rotation.y;
                    const moveVector = new THREE.Vector3(deltaX, 0, deltaZ);
                    moveVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraRotationY);

                    pos.x = this.lastGoodPosition.x + moveVector.x;
                    pos.z = this.lastGoodPosition.z + moveVector.z;
                }

                const resultado = this.moverEjeSeguro(this.lastGoodPosition, pos.x, pos.z);
                pos.x = resultado.x;
                pos.z = resultado.z;

                this.lastGoodPosition.copy(pos);
            }
        });
    </script>
